name: Deploy ABT-Identity App

on:
  push:
    branches: ["master"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Check out the code
      - uses: actions/checkout@v4

      # تحديث الريموت ليستخدم رمز الوصول الشخصي
      - name: Update Git Remote to use Token
        run: git remote set-url origin https://${{ secrets.ACCESS_TOKEN }}@github.com/omarshaheen95/abt-identity.git

      # Add server to known hosts
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_ADDRESS }} >> ~/.ssh/known_hosts

      # Test SSH Connection with username and password
      - name: Test SSH Connection
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_ADDRESS }} "echo Connection successful"

      # Deploy files to the server
      - name: Deploy to Server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_ADDRESS }} "
            cd /home/omar/websites/abt-identity &&
            git config --global user.name 'GitHub Action' &&
            git config --global user.email 'action@github.com' &&
            { php artisan down || echo 'artisan down failed, deploying without maintenance mode'; } &&
            git stash --include-untracked &&
            rm -f composer.lock &&
            git remote set-url origin https://${{ secrets.ACCESS_TOKEN }}@github.com/omarshaheen95/ABT-Identity.git &&
            git checkout master &&
            git pull origin master &&
            rm -f bootstrap/cache/*.php &&
            composer install --no-dev --optimize-autoloader --no-interaction &&
            php artisan migrate --force &&
            php artisan permission:cache-reset &&
            php artisan cache:clear &&
            php artisan config:cache &&
            php artisan route:cache &&
            php artisan view:cache &&
            php artisan queue:restart &&
            php artisan up
          "

